<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sahaara AI">
  <title>Sahaara AI — Wellbeing & Health Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">

  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/ai-assistant.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <!-- Authentication Screen Container (Visible when logged out) -->
  <div id="auth-container" class="auth-container" style="display:none"></div>

  <!-- Main Application Shell -->
  <div id="root"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <!-- Sahaara AI Assistant Floating Action Button -->
  <button class="ai-fab" id="ai-fab" onclick="toggleAIPanel()" aria-label="Open Sahaara AI Assistant" title="Talk to Sahaara AI">
    <span class="pulse"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3l1.8 5.4a2.2 2.2 0 0 0 1.4 1.4L20.6 12l-5.4 1.8a2.2 2.2 0 0 0-1.4 1.4L12 20.6l-1.8-5.4a2.2 2.2 0 0 0-1.4-1.4L3.4 12l5.4-1.8a2.2 2.2 0 0 0 1.4-1.4z"/>
      <path d="M19 2v4M21 4h-4"/>
      <path d="M4 17v3M5.5 18.5h-3"/>
    </svg>
  </button>
  <div id="ai-panel" class="ai-panel desktop closed" role="dialog" aria-label="Sahaara AI Assistant"></div>

  <!-- Voice Conversation Floating Action Button -->
  <button class="voice-fab" id="voice-fab" onclick="openVoiceMode()" aria-label="Open Voice AI" title="Voice conversation with Sahaara">
    <span class="pulse-ring"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" x2="12" y1="19" y2="22"/>
      <path d="M3 10a9 9 0 0 0 1.5 5M21 10a9 9 0 0 1-1.5 5"/>
    </svg>
  </button>
  <div id="voice-fullscreen" class="voice-fullscreen closed" role="dialog" aria-label="Sahaara voice conversation"></div>

  <!-- Emergency SOS Floating Action Button -->
  <button class="emergency-fab" onclick="openEmergencyModal()" aria-label="Emergency SOS" title="Emergency SOS">
    <span class="pulse-ring-em"></span>🚨
  </button>
  <div id="emergency-modal-root"></div>

  <!-- External 3D Engine (Three.js with CDNJS fallback) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js" onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';s.onerror=function(){window.__CT_THREE_FAILED__=true};document.head.appendChild(s)"></script>

  <!-- Modular Scripts Architecture -->
  <script src="js/anime-compat.js"></script>
  <script src="js/backend-sync.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/wellbeing.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/voice-mode.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
